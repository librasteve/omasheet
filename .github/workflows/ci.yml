name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # omasheet-ui needs Qt 6 to build, so it is left out here.
      - run: cargo clippy --workspace --exclude omasheet-ui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude omasheet-ui
