<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", "Noto Sans", "DejaVu Sans", sans-serif;
    color: #e8ecf4; padding: 52px 64px;
    background:
      radial-gradient(900px 500px at 100% 0%, #2b3a8c55, transparent 60%),
      radial-gradient(700px 400px at 0% 100%, #0e7c6b44, transparent 60%),
      #0d1117;
    display: flex; flex-direction: column;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: #7ee0c8; font-weight: 700; }
  .tag { font: 600 22px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
         color: #0d1117; background: #7ee0c8; padding: 6px 16px; border-radius: 999px; }
  h1 { font-size: 46px; line-height: 1.08; margin-top: 22px; letter-spacing: -.02em; }
  .sum { font-size: 22px; line-height: 1.35; color: #a9b3c6; margin-top: 14px; max-width: 1020px; }
  ol { list-style: none; padding: 0; margin-top: 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  li { display: flex; gap: 14px; background: #ffffff0a; border: 1px solid #ffffff1a;
       border-radius: 16px; padding: 20px 20px 18px; }
  .n { flex: none; width: 34px; height: 34px; border-radius: 50%; background: #3b5bdb; color: #fff;
       font-weight: 700; font-size: 18px; display: grid; place-items: center; }
  h2 { font-size: 21px; line-height: 1.2; }
  li p { font-size: 16px; line-height: 1.35; color: #a9b3c6; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  code { font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
         background: #0b3d36; color: #9ff0d9; padding: 4px 9px; border-radius: 7px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 19px; color: #7d8799; }
  .foot b { color: #e8ecf4; font-weight: 600; }
</style>
<div class="top"><div class="brand">Omasheet</div><div class="tag">{{TAG}}</div></div>
<h1>{{TITLE}}</h1>
<div class="sum">{{SUMMARY}}</div>
<ol>
{{ITEMS}}</ol>
<div class="foot"><span>What Markdown is to words, Omasheet is to numbers.</span><b>github.com/librasteve/omasheet</b></div>
