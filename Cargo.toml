[workspace]
resolver = "3"
members = [
    "omasheet-omx",
    "omasheet-engine",
    "omasheet-interop",
    "omasheet-md",
    "omasheet-cli",
    "omasheet-ui",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/librasteve/omasheet"

[workspace.dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
jiff = "0.2"
omasheet-omx = { path = "omasheet-omx" }
omasheet-engine = { path = "omasheet-engine" }
omasheet-interop = { path = "omasheet-interop" }
omasheet-md = { path = "omasheet-md" }
omasheet-cli = { path = "omasheet-cli" }
calamine = "0.36"
rust_xlsxwriter = "0.99"
csv = "1"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
