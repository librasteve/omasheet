[workspace]
resolver = "3"
members = [
    "omasheet-omx",
    "omasheet-engine",
    "omasheet-interop",
    "omasheet-md",
    "omasheet-cli",
    "omasheet-ui",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/librasteve/omasheet"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
jiff = "0.2"
omasheet-omx = { path = "omasheet-omx" }
omasheet-engine = { path = "omasheet-engine" }
omasheet-interop = { path = "omasheet-interop" }
omasheet-md = { path = "omasheet-md" }
omasheet-cli = { path = "omasheet-cli" }
calamine = "0.36"
rust_xlsxwriter = "0.99"
csv = "1"
# Polars, for Parquet, for the dataframe-backed tables of
# `add-dataframe-interop`, and for the evaluation of `add-columnar-core`.
# Unconditional, per D26. `lazy` is what `Expr`, `col()` and the aggregates
# live behind; `propagate_nans` is a passthrough to it, and is what would
# make `max` over a NaN agree with the engine (D71a).
polars = { version = "0.51", default-features = false, features = [
    "lazy",
    "propagate_nans",
    "parquet",
    # A big CSV is read through a Parquet copy (open-a-big-csv D153).
    "csv",
    "dtype-decimal",
    "dtype-date",
    "dtype-datetime",
    "dtype-time",
    "dtype-duration",
    # The narrow whole numbers a Parquet file may hold, read and written
    # back at their own width and sign (add-polars-dtypes 5.4).
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
    # The tests a filter is written with (filter-by-expression D177).
    "strings",
    "regex",
    "find_many",
    "is_in",
    "is_between",
    "is_unique",
    "is_first_distinct",
    "is_last_distinct",
] }
regex = "1"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Dependencies (Polars above all) are built without debug info: with it, a
# debug build and its test binaries outgrow a small disk. The workspace's own
# crates keep theirs, so a backtrace through omasheet still has line numbers.
[profile.dev.package."*"]
debug = false
