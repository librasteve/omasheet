[package]
name = "omasheet-ui"
description = "Omasheet: the omasheet command, and its interactive grid for .omx files, built with Qt Quick"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "omasheet"
path = "src/main.rs"

[dependencies]
omasheet-engine.workspace = true
omasheet-interop.workspace = true
omasheet-md.workspace = true
omasheet-cli.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
notify = { version = "8", default-features = false }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
