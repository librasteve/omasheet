[package]
name = "omasheet-ui"
description = "Omasheet: an interactive grid for .omx sheets, built with Qt Quick"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "omasheet-ui"
path = "src/main.rs"

[dependencies]
omasheet-engine.workspace = true
omasheet-interop.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
