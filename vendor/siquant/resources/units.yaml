# Units. Each entry has a `symbol`, a `name` (a picker label only) and exactly
# one of:
#   base: <base dimension>   a base unit of that dimension
#   defn: <unit expression>  defined over units listed EARLIER in this file,
#                            in the same notation as cell text (kg.m^2.s^-2)
#
# Optional: `factor` (decimal string, default 1; the size of the unit in the
# coherent SI unit), `offset` (decimal string, default 0; added in the unit's
# own scale before scaling, so kelvin = (celsius + 273.15) * 1), `alt`
# (typographic alternate symbols), `prefixable` (none | si | binary | both,
# default none) and `live` (true, the default, means it may be written in
# cell text; false means a column-level unit only).
#
# A printed compound unit lists positive exponents first, named derived units
# before base units, then base units in the order below (mass, length, current,
# temperature, amount, luminous intensity, and time last): N.m, kg.m.s^-2,
# A.s, m.s^-1.
#
# `g`, not `kg`, is the prefixable mass unit, at 1e-3 of the coherent kilogram,
# so `kg` is just `k` + `g` with no special case.

# SI base units.
- {symbol: g,   name: gram,     base: Mass,              factor: "0.001", prefixable: si, group: Size}
- {symbol: m,   name: metre,    base: Length,            prefixable: si}
- {symbol: A,   name: ampere,   base: Current,           prefixable: si}
- {symbol: K,   name: kelvin,   base: Temperature,       prefixable: si}
- {symbol: mol, name: mole,     base: Amount,            prefixable: si}
- {symbol: cd,  name: candela,  base: LuminousIntensity, prefixable: si}
- {symbol: s,   name: second,   base: Time,              prefixable: si}

# Celsius is affine: kelvin = (celsius + 273.15). Not prefixable, and legal
# only on its own (never inside a compound unit).
- {symbol: "°C", name: degree Celsius, defn: K, offset: "273.15", alt: ["ºC"], group: Size}

# SI named derived units.
- {symbol: Hz,  name: hertz,     defn: "s^-1",                prefixable: si, group: Size}
- {symbol: N,   name: newton,    defn: "kg.m.s^-2",           prefixable: si, group: Mechanical}
- {symbol: Pa,  name: pascal,    defn: "kg.m^-1.s^-2",        prefixable: si, group: Mechanical}
- {symbol: J,   name: joule,     defn: "kg.m^2.s^-2",         prefixable: si, group: Mechanical}
- {symbol: W,   name: watt,      defn: "kg.m^2.s^-3",         prefixable: si, group: Mechanical}
- {symbol: C,   name: coulomb,   defn: "A.s",                 prefixable: si, group: Electromagnetic}
- {symbol: V,   name: volt,      defn: "kg.m^2.A^-1.s^-3",    prefixable: si, group: Electromagnetic}
- {symbol: F,   name: farad,     defn: "kg^-1.m^-2.A^2.s^4",  prefixable: si, group: Electromagnetic}
- {symbol: Ω,   name: ohm,       defn: "kg.m^2.A^-2.s^-3",    prefixable: si, alt: ["Ω"], group: Electromagnetic}
- {symbol: S,   name: siemens,   defn: "kg^-1.m^-2.A^2.s^3",  prefixable: si, group: Electromagnetic}
- {symbol: Wb,  name: weber,     defn: "kg.m^2.A^-1.s^-2",    prefixable: si, group: Electromagnetic}
- {symbol: T,   name: tesla,     defn: "kg.A^-1.s^-2",        prefixable: si, group: Electromagnetic}
- {symbol: H,   name: henry,     defn: "kg.m^2.A^-2.s^-2",    prefixable: si, group: Electromagnetic}
- {symbol: Bq,  name: becquerel, defn: "s^-1",                prefixable: si, group: Radiation}
- {symbol: Gy,  name: gray,      defn: "m^2.s^-2",            prefixable: si, group: Radiation}
- {symbol: Sv,  name: sievert,   defn: "m^2.s^-2",            prefixable: si, group: Radiation}
- {symbol: kat, name: katal,     defn: "mol.s^-1",            prefixable: si, group: Thermodynamic}

# Data (Stage 2). The bit is the base unit of data and the byte is eight of
# them. Both take the SI prefixes (`kB` is 1000 B) and the binary ones (`KiB` is
# 1024 B); rates need no entry of their own: `kb.s^-1`, `MiB.s^-1`.
- {symbol: b, name: bit,  base: Data, prefixable: both, group: Data}
- {symbol: B, name: byte, defn: b, factor: "8", prefixable: both, group: Data}

# Angles (Stage 3). The radian is the base unit of the angle dimension, so a
# frequency (`s^-1`) and an angular speed (`rad.s^-1`) are not the same thing,
# and the steradian is a radian squared. The degree, the minute of arc and the
# second of arc are non-SI units the SI accepts; they are live so that `45°`
# can be written, and cannot take a prefix. `'` and `"` are the ASCII
# alternates of `′` and `″`, and `º` of `°`.
- {symbol: rad, name: radian,    base: Angle, prefixable: si, group: Angle}
- {symbol: sr,  name: steradian, defn: "rad^2", prefixable: si, group: Angle}
- {symbol: "°", name: degree,    defn: rad, factor: "0.017453292519943295", alt: ["º"], group: Angle}
- {symbol: "′", name: arcminute, defn: "°", factor: "0.016666666666666666", alt: ["'"], group: Angle}
- {symbol: "″", name: arcsecond, defn: "′", factor: "0.016666666666666666", alt: ['"'], group: Angle}

# Luminous flux and illuminance (Stage 3): the lumen and the lux need the steradian.
- {symbol: lm,  name: lumen,     defn: "cd.sr",    prefixable: si, group: Radiation}
- {symbol: lx,  name: lux,       defn: "cd.sr.m^-2", prefixable: si, group: Radiation}

# Non-SI units for the metric stage (omasheet): each an exact multiple of an
# SI unit, none of the imperial ones. `L` is the other spelling of the litre.
# `Da` is the dalton (CODATA 2022: 1.66053906892e-27 kg).
- {symbol: l,   name: litre,            defn: "m^3", factor: "0.001",     alt: ["L"], prefixable: si, group: Size}
- {symbol: t,   name: tonne,            defn: g,      factor: "1000000", group: Size}
- {symbol: ha,  name: hectare,          defn: "m^2", factor: "10000",                  group: Size}
- {symbol: bar, name: bar,              defn: Pa,     factor: "100000",                prefixable: si, group: Mechanical}
- {symbol: eV,  name: electronvolt,     defn: J,      factor: "1.602176634e-19",       prefixable: si, group: Mechanical}
- {symbol: cal, name: calorie,          defn: J,      factor: "4.184",                 prefixable: si, group: Mechanical}
- {symbol: Wh,  name: watt-hour,        defn: J,      factor: "3600",                  prefixable: si, group: Mechanical}
# Units of time, each an exact multiple of the second. They are not prefixable:
# `h` and `d` are units on their own and the prefixes hecto and deci only
# before another unit, as `hPa` and `dm`.
- {symbol: min, name: minute,           defn: s,      factor: "60",                   group: Size}
- {symbol: h,   name: hour,             defn: s,      factor: "3600",                 group: Size}
- {symbol: d,   name: day,              defn: s,      factor: "86400",                group: Size}
- {symbol: wk,  name: week,             defn: s,      factor: "604800",               group: Size}
- {symbol: Da,  name: dalton,           defn: g,      factor: "1.66053906892e-24",     prefixable: si, group: Size}

# Astronomical lengths, exact: the astronomical unit (IAU 2012), the light
# year (the Julian year at the speed of light), the light day, and the parsec
# (648000/pi astronomical units, to the digits a double holds). The parsec,
# the light year and the Julian year take prefixes: `kpc`, `Mly`, `Gyr`.
- {symbol: au,  name: astronomical unit, defn: m, factor: "149597870700",       group: Size}
- {symbol: ly,  name: light year,        defn: m, factor: "9460730472580800",  prefixable: si, group: Size}
- {symbol: ld,  name: light day,         defn: m, factor: "25902068371200",     group: Size}
- {symbol: pc,  name: parsec,            defn: m, factor: "3.0856775814913673e16", prefixable: si, group: Size}
- {symbol: "Å", name: angstrom,          defn: m, factor: "1e-10", alt: ["å", "\u212b"], group: Size}
- {symbol: nmi, name: nautical mile,     defn: m, factor: "1852",               group: Size}
- {symbol: kn,  name: knot,              defn: "nmi.h^-1", group: Mechanical}
- {symbol: yr,  name: year,              defn: s, factor: "31557600",           prefixable: si, group: Size}
# Area and mass. The barn is spelled out, as `b` is the bit; the tonne takes no
# prefix, so the kilotonne and the megatonne are units of their own.
- {symbol: are,  name: are,       defn: "m^2", factor: "100",    group: Size}
- {symbol: barn, name: barn,      defn: "m^2", factor: "1e-28",  prefixable: si, group: Size}
- {symbol: ct,   name: carat,     defn: g,     factor: "0.2",    group: Size}
- {symbol: kt,   name: kilotonne, defn: g,     factor: "1000000000",  group: Size}
- {symbol: Mt,   name: megatonne, defn: g,     factor: "1000000000000", group: Size}
# Angle: the gon (a hundredth of a right angle) and the turn.
- {symbol: gon, name: gon,        defn: rad, factor: "0.015707963267948967", group: Angle}
- {symbol: rev, name: revolution, defn: rad, factor: "6.283185307179586", group: Angle}
# Pressure and power. The torr is 101325/760 Pa, the mmHg its conventional
# value, and `hp` the metric horsepower (the German PS), 75 kgf.m/s; `PS` itself is a petasiemens.
- {symbol: atm,  name: atmosphere, defn: Pa, factor: "101325",             group: Mechanical}
- {symbol: torr, name: torr,       defn: Pa, factor: "133.32236842105263", prefixable: si, group: Mechanical}
- {symbol: mmHg, name: millimetre of mercury, defn: Pa, factor: "133.322387415", group: Mechanical}
- {symbol: hp,   name: metric horsepower,     defn: W,  factor: "735.49875",     group: Mechanical}
# Radiation: the rem, the curie and the roentgen; the rad of dose is left out
# as it is the radian's symbol.
- {symbol: rem, name: rem,      defn: Sv,       factor: "0.01",   prefixable: si, group: Radiation}
- {symbol: Ci,  name: curie,    defn: Bq,       factor: "3.7e10", prefixable: si, group: Radiation}
- {symbol: R,   name: roentgen, defn: "C.kg^-1", factor: "2.58e-4", prefixable: si, group: Radiation}
# Other science units: the jansky, the tog and the sverdrup (`Sv` is the
# sievert).
- {symbol: Jy,       name: jansky,    defn: "W.m^-2.Hz^-1", factor: "1e-26", prefixable: si, group: Other}
- {symbol: tog,      name: tog,       defn: "K.m^2.W^-1",   factor: "0.1",   group: Other}
- {symbol: sverdrup, name: sverdrup,  defn: "m^3.s^-1",     factor: "1e6",   group: Other}
